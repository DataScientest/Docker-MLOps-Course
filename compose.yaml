# Stack de developpement de Sillage.
# Lance l'API (construite depuis le Dockerfile local) et sa base vectorielle.
# Les tests sont derriere un profile : ils ne demarrent que sur demande.
services:
  qdrant:
    image: qdrant/qdrant:v1.18.2
    volumes:
      - qdrant-storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build: .
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
    volumes:
      - hf-cache:/home/appuser/.cache/huggingface
    depends_on:
      qdrant:
        condition: service_healthy

  # Conteneur de tests : interroge l'API par son nom de service, a travers le
  # reseau Docker. Ne demarre qu'avec le profile "test".
  tests:
    build:
      context: .
      dockerfile: tests/Dockerfile
    environment:
      API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    profiles:
      - test

volumes:
  qdrant-storage:
  hf-cache:
