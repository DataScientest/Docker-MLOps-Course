name: Build, test, scan et publication

# Se declenche a chaque push sur main. Chaque etape est une barriere :
# si le build, les tests ou le scan echouent, rien n'est publie.
on:
  push:
    branches: [main]

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # autorise le GITHUB_TOKEN a pousser sur GHCR

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Construire l'image
        run: docker build -t sillage-api:ci .

      # Les tests interrogent l'artefact reel a travers le reseau Docker, via
      # le profile "test" de Compose. On construit l'image de test, on lance la
      # stack, et on echoue si un test echoue.
      - name: Lancer les tests a travers le reseau
        run: |
          docker compose --profile test up \
            --build --abort-on-container-exit --exit-code-from tests

      - name: Arreter la stack de test
        if: always()
        run: docker compose --profile test down -v

      # Barriere de securite : le scan echoue (et donc la chaine) si une
      # vulnerabilite HIGH ou CRITICAL est trouvee.
      - name: Scanner l'image avec Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: sillage-api:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Normaliser le namespace en minuscules
        id: ns
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: S'authentifier aupres de GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Taguer et publier l'image
        run: |
          IMAGE=ghcr.io/${{ steps.ns.outputs.owner }}/sillage-api
          docker tag sillage-api:ci "$IMAGE:1.0.0"
          docker push "$IMAGE:1.0.0"
