# Stack avec resume active par un modele DISTANT (fournisseur type Groq).
# Lancer avec :  docker compose -f compose.remote.yaml --profile digest-remote up -d
#
# Le modele tourne chez un fournisseur, joint par une adresse et authentifie
# par une cle. Cette cle est un vrai secret : elle est montee en fichier via
# le mecanisme `secrets`, jamais passee en variable d'environnement.
#
# Deposez votre cle avant de lancer :  echo "votre-cle" > groq_api_key.txt
services:
  qdrant:
    image: qdrant/qdrant:v1.18.2
    volumes:
      - qdrant-storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build: .
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      DIGEST_URL: https://api.groq.com/openai/v1
      DIGEST_MODEL: llama-3.1-8b-instant
    secrets:
      - groq_api_key
    volumes:
      - hf-cache:/home/appuser/.cache/huggingface
    depends_on:
      qdrant:
        condition: service_healthy
    profiles:
      - digest-remote

secrets:
  groq_api_key:
    file: ./groq_api_key.txt

volumes:
  qdrant-storage:
  hf-cache:
