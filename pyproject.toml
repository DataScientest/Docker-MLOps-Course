[project]
name = "sillage-api"
version = "1.0.0"
description = "API de veille media : recherche semantique et resume d'articles."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "fastembed>=0.5",
    "qdrant-client>=1.12",
    "openai>=1.60",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "requests>=2.32",
]

[tool.uv]
package = false
